[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-sia-rag"
version = "0.1.0"
description = "A production-minded RAG Q&A service with evaluation and load testing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anuhya Sankranti" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "openai>=2.0,<3.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "pypdf>=5.1,<7.0",
  "python-multipart>=0.0.18,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "locust>=2.32,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
mini-sia = "mini_sia.main:run"
mini-sia-eval = "mini_sia.eval.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

